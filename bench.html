<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>AVBD 2D Benchmark</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #f4f4f1;
        --fg: #1d1d1f;
        --muted: #6b6b70;
        --line: #d8d8d4;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #161618;
          --fg: #ececee;
          --muted: #9a9aa0;
          --line: #333338;
        }
      }
      body {
        margin: 0;
        padding: 24px 16px;
        background: var(--bg);
        color: var(--fg);
        font: 14px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      main {
        max-width: 1100px;
        margin: 0 auto;
      }
      h1 {
        font-size: 18px;
        margin: 0 0 4px;
      }
      p {
        color: var(--muted);
        margin: 0 0 16px;
      }
      .controls {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        align-items: center;
        margin-bottom: 12px;
      }
      button,
      select {
        font: inherit;
        padding: 6px 12px;
      }
      #status {
        color: var(--muted);
        min-height: 1.5em;
      }
      .adapter {
        color: var(--fg);
      }
      a {
        color: inherit;
      }
      .table-wrap {
        overflow-x: auto;
      }
      table {
        border-collapse: collapse;
        width: 100%;
      }
      th,
      td {
        text-align: right;
        padding: 4px 10px;
        border-bottom: 1px solid var(--line);
        white-space: nowrap;
      }
      th:first-child,
      td:first-child {
        text-align: left;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>AVBD 2D — GPU benchmark</h1>
      <p>
        Runs the whole 2D step (collision, colouring, solve) on this machine's GPU for a fixed scene suite. Close
        other GPU-heavy tabs and keep this tab visible while it runs (hidden tabs are throttled). Takes a few
        minutes. <a href="bench3d.html">3D benchmark</a>
      </p>
      <div class="controls">
        <label>Iterations <select id="iterations">
          <option value="4,10">4 and 10</option>
          <option value="4">4</option>
          <option value="10">10</option>
        </select></label>
        <label>Primal <select id="primal">
          <option value="bucket,scan">bucket and scan</option>
          <option value="bucket">bucket</option>
          <option value="scan">scan</option>
        </select></label>
        <button id="run">Run benchmark</button>
        <button id="copy" disabled>Copy results</button>
      </div>
      <div id="status"></div>
      <div id="results" class="table-wrap"></div>
    </main>
    <script type="module" src="/src/bench2d/main.ts"></script>
  </body>
</html>
