<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AVBD 2D</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #f4f4f1;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      #view {
        display: block;
        width: 100vw;
        height: 100vh;
        touch-action: none;
      }
      #hud {
        position: fixed;
        left: 12px;
        bottom: 12px;
        padding: 8px 10px;
        font-size: 12px;
        line-height: 1.5;
        white-space: pre;
        color: #1d1d1f;
        background: rgb(255 255 255 / 0.8);
        border-radius: 6px;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <canvas id="view"></canvas>
    <div id="hud"></div>
    <script type="module" src="/src/app2d/main.ts"></script>
  </body>
</html>
